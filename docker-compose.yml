name: ${PROJECT_NAME:-erpnext}

x-frappe-defaults: &frappe_defaults
  image: ${PROJECT_NAME:-erpnext}-letron-runtime:local
  pull_policy: never
  build:
    context: .
    dockerfile: Dockerfile
    args:
      ERPNEXT_IMAGE: ${ERPNEXT_IMAGE}
  platform: ${PLATFORM}
  restart: ${RESTART_POLICY}
  networks: [frappe_network]
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
    - backups:/home/frappe/backups
    - ./apps/erpnext:/home/frappe/frappe-bench/apps/erpnext:ro
    - ./apps/letron_api:/home/frappe/frappe-bench/apps/${INTEGRATION_APP}:ro
    - ./contracts:/home/frappe/frappe-bench/contracts:ro
    - ./docker/backend-entrypoint.sh:/usr/local/bin/backend-entrypoint.sh:ro
    - type: bind
      source: ${LETRON_CONFIG_HOST_DIR:-./config}
      target: /etc/letron/config
  environment: &frappe_environment
    DB_HOST: ${DB_HOST}
    DB_PORT: ${DB_PORT}
    REDIS_CACHE: ${REDIS_CACHE}
    REDIS_QUEUE: ${REDIS_QUEUE}
    FRAPPE_REDIS_CACHE: redis://${REDIS_CACHE}
    FRAPPE_REDIS_QUEUE: redis://${REDIS_QUEUE}
    DEVELOPER_MODE: ${DEVELOPER_MODE}
    FRAPPE_SITE_NAME_HEADER: ${SITE_HEADER}
    INTEGRATION_APP: ${INTEGRATION_APP}
    INTEGRATION_APP_ENABLED: ${INTEGRATION_APP_ENABLED}
    DELIVERY_ENABLED: ${DELIVERY_ENABLED}
    PYTHONPATH: /home/frappe/frappe-bench/apps/${INTEGRATION_APP}
    LETRON_CONFIG_DIR: /etc/letron/config
    LETRON_SSO_ISSUER: ${LETRON_SSO_ISSUER:-}
    LETRON_SSO_INTERNAL_ISSUER: ${LETRON_SSO_INTERNAL_ISSUER:-}
    LETRON_SSO_CLIENT_ID: ${LETRON_SSO_CLIENT_ID:-}
    LETRON_SSO_CLIENT_SECRET: ${LETRON_SSO_CLIENT_SECRET:-}
    LETRON_SSO_ERP_BASE_URL: ${LETRON_SSO_ERP_BASE_URL:-}
    LETRON_SSO_ROLE_SYNC_ENABLED: ${LETRON_SSO_ROLE_SYNC_ENABLED:-false}
    LETRON_SSO_LARK_ROLE_MAPPING: ${LETRON_SSO_LARK_ROLE_MAPPING:-}
    LETRON_SSO_LARK_MANAGED_ROLES: ${LETRON_SSO_LARK_MANAGED_ROLES:-}
    LETRON_SSO_REQUIRED_LARK_GROUP_ID: ${LETRON_SSO_REQUIRED_LARK_GROUP_ID:-}
    LETRON_SSO_SYNC_URL: ${LETRON_SSO_SYNC_URL:-}
    LETRON_SSO_SYNC_SECRET: ${LETRON_SSO_SYNC_SECRET:-}
    LETRON_SUPPLIER_PORTAL_SECRET: ${LETRON_SUPPLIER_PORTAL_SECRET:-}
    LETRON_API_KEY: ${LETRON_API_KEY:-}
    LETRON_SUPPLIER_PORTAL_CRON_SECRET: ${LETRON_SUPPLIER_PORTAL_CRON_SECRET:-}
    LETRON_SSO_REQUEST_CHECK_INTERVAL_SECONDS: ${LETRON_SSO_REQUEST_CHECK_INTERVAL_SECONDS:-60}
    LETRON_SSO_SNAPSHOT_MAX_AGE_SECONDS: ${LETRON_SSO_SNAPSHOT_MAX_AGE_SECONDS:-120}
    LETRON_SSO_STALE_LOCK_SECONDS: ${LETRON_SSO_STALE_LOCK_SECONDS:-600}
    LETRON_SSO_BREAK_GLASS_MAX_SECONDS: ${LETRON_SSO_BREAK_GLASS_MAX_SECONDS:-3600}
    SITE_NAME: ${SITE_NAME}
    DB_ROOT_USER: ${DB_ROOT_USER}
    MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    REDIS_SOCKETIO: ${REDIS_SOCKETIO}
    ALLOW_TESTS: ${ALLOW_TESTS}
    REQUEST_TIMEOUT: ${REQUEST_TIMEOUT}
    COUNTRY: ${COUNTRY}
    TIMEZONE: ${TIMEZONE}
    LANGUAGE: ${LANGUAGE}
    CURRENCY: ${CURRENCY}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-southeast-1}
    S3_BUCKET_NAME: ${S3_BUCKET_NAME:-letron-erp-backups}

services:
  db:
    image: ${DB_IMAGE}
    restart: ${RESTART_POLICY}
    networks: [frappe_network]
    command:
      - --character-set-server=${DB_CHARSET}
      - --collation-server=${DB_COLLATION}
      - --skip-character-set-client-handshake
    environment:
      MARIADB_ROOT_USER: ${DB_ROOT_USER}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
    healthcheck:
      test: [CMD-SHELL, "mariadb-admin ping -h localhost -u$${MARIADB_ROOT_USER} -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes: ["db-data:/var/lib/mysql"]

  redis:
    image: ${REDIS_CACHE_IMAGE}
    restart: ${RESTART_POLICY}
    networks: [frappe_network]
    volumes: ["redis-queue-data:/data"]

  backend:
    <<: *frappe_defaults
    command: [bash, /usr/local/bin/backend-entrypoint.sh]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    ports: ["${HTTP_PORT}:8000"]

  cloudflared:
    image: cloudflare/cloudflared:2026.6.0
    restart: ${RESTART_POLICY}
    command: [tunnel, run, --token, "${CLOUDFLARE_TUNNEL_TOKEN}"]
    depends_on:
      backend: {condition: service_started}
    networks: [frappe_network]

  backup-init:
    <<: *frappe_defaults
    profiles: [operations]
    user: root
    restart: "no"
    entrypoint: [sh, -c]
    command: ["chown -R 1000:1000 /home/frappe/backups"]
    depends_on:
      db: {condition: service_healthy}

  backup:
    <<: *frappe_defaults
    profiles: [operations]
    restart: "no"
    entrypoint: [bash, -c]
    command:
      - >-
        set -e;
        if [ "$${BACKUP_ENABLED}" != "True" ] && [ "$${BACKUP_ENABLED}" != "true" ]; then
          echo "Scheduled backup disabled";
          exec sleep infinity;
        fi;
        while true; do
          staging="/home/frappe/backups/.staging";
          mkdir -p "$${staging}";
          rm -f "$${staging}"/*;
          files_flag="";
          if [ "$${BACKUP_WITH_FILES}" = "True" ] || [ "$${BACKUP_WITH_FILES}" = "true" ]; then files_flag="--with-files --compress"; fi;
          bench --site "$${SITE_NAME}" backup $$files_flag --backup-path "$${staging}";
          db_backup="$$(ls -1t "$${staging}"/*-database.sql.gz | sed -n '1p')";
          gzip -t "$${db_backup}";
          for backup_file in "$${staging}"/*; do mv "$${backup_file}" /home/frappe/backups/; done;
          find /home/frappe/backups -type f -mtime +"$${BACKUP_RETENTION_DAYS}" -delete;
          if [ "$${BACKUP_ONCE}" = "True" ] || [ "$${BACKUP_ONCE}" = "true" ]; then exit 0; fi;
          sleep "$$(($${BACKUP_INTERVAL_HOURS} * 3600))";
        done
    environment:
      <<: *frappe_environment
      SITE_NAME: ${SITE_NAME}
      BACKUP_ENABLED: ${BACKUP_ENABLED}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS}
      BACKUP_WITH_FILES: ${BACKUP_WITH_FILES}
      BACKUP_ONCE: "False"
    depends_on: {backup-init: {condition: service_completed_successfully}}

  backup-verify:
    <<: *frappe_defaults
    profiles: [operations]
    restart: "no"
    entrypoint: [bash, -c]
    command:
      - >-
        set -e;
        if ! ls /home/frappe/backups/*-database.sql.gz >/dev/null 2>&1; then
          echo "No local backup found. Downloading latest verified backup from AWS S3...";
          if ! /home/frappe/frappe-bench/env/bin/python -c "import boto3" >/dev/null 2>&1; then
            /home/frappe/frappe-bench/env/bin/pip install boto3 >/dev/null 2>&1 || true;
          fi;
          /home/frappe/frappe-bench/env/bin/python -c "from letron_api.restore import download_latest_backup; download_latest_backup('/home/frappe/backups')";
        fi;
        sql="";
        for candidate in $$(ls -1t /home/frappe/backups/*-database.sql.gz); do
          if gzip -t "$${candidate}" >/dev/null 2>&1; then sql="$${candidate}"; break; fi;
        done;
        test -n "$${sql}";
        prefix="$${sql%-database.sql.gz}";
        public="$${prefix}-files.tgz";
        private="$${prefix}-private-files.tgz";
        drill_site="restore-drill-$$$$.local";
        drill_db="letron_restore_drill_$$$$";
        cleanup() {
          bench drop-site "$${drill_site}" --no-backup --force --db-root-username "$${DB_ROOT_USER}" --db-root-password "$${DB_ROOT_PASSWORD}" >/dev/null 2>&1 || true;
          rm -f /home/frappe/backups/*;
        };
        trap cleanup EXIT;
        bench new-site "$${drill_site}" --mariadb-user-host-login-scope='%' --db-name "$${drill_db}" --admin-password "$${ADMIN_PASSWORD}" --db-root-username "$${DB_ROOT_USER}" --db-root-password "$${DB_ROOT_PASSWORD}";
        bench --site "$${drill_site}" restore "$${sql}" --force --db-root-username "$${DB_ROOT_USER}" --db-root-password "$${DB_ROOT_PASSWORD}" --with-public-files "$${public}" --with-private-files "$${private}";
        bench --site "$${drill_site}" execute letron_api.api.runtime_info;
        echo "Backup restore drill verified: $${drill_site}";
    environment:
      <<: *frappe_environment
      DB_ROOT_USER: ${DB_ROOT_USER}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      db: {condition: service_healthy}
      backup-init: {condition: service_completed_successfully}

volumes:
  db-data: {name: "${DB_VOLUME}"}
  redis-queue-data: {name: "${REDIS_QUEUE_VOLUME}"}
  sites: {name: "${SITES_VOLUME}"}
  logs: {name: "${LOGS_VOLUME}"}
  backups: {name: "${BACKUP_VOLUME}"}
networks:
  frappe_network: {driver: bridge}
