        item_row:
          type: string
        tax_row:
          type: string
        rate:
          type: number
        amount:
          type: number
          x-frappe-options: Company:company:default_currency
        taxable_amount:
          type: number
          x-frappe-options: Company:company:default_currency
      required:
      - item_row
      - name
      - tax_row
      additionalProperties: true
