components:
  securitySchemes:
    frappeToken:
      type: apiKey
      in: header
      name: Authorization
      description: 'Frappe token authentication: token api_key:api_secret'
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: false
      schema:
        type: string
  schemas:
    Address:
      type: object
      properties:
        name: *id024
        address_details: *id025
        address_title: *id026
        address_type: *id027
        address_line1: *id028
        address_line2: *id029
        city: *id030
        county: *id031
        state: *id032
        country: *id033
        pincode: *id034
        column_break0: *id035
        email_id: *id036
        phone: *id037
        fax: *id038
        is_primary_address: *id039
        is_shipping_address: *id040
        disabled: *id041
        linked_with: *id042
        links: *id043
      required:
      - address_line1
      - address_type
      - city
      - country
      - name
      additionalProperties: true
      x-module: Contacts
    Contact:
      type: object
      properties:
        name: *id044
        contact_section: *id045
        first_name: *id046
        last_name: *id047
        email_id:
          type: string
          x-frappe-options: Email
          readOnly: true
        user: *id048
        cb00: *id049
        status: *id050
        salutation: *id051
        gender: *id052
        phone:
          type: string
          x-frappe-options: Phone
          readOnly: true
        image: *id053
        contact_details: *id054
        is_primary_contact: *id055
        links: *id056
        more_info: *id057
        department: *id058
        designation: *id059
        unsubscribed: *id060
        middle_name: *id061
        sb_00: *id062
        email_ids: *id063
        address: *id064
        phone_nos: *id065
        mobile_no:
          type: string
          x-frappe-options: Phone
          readOnly: true
        pulled_from_google_contacts:
          type: boolean
          readOnly: true
        sync_with_google_contacts: *id066
        google_contacts: *id067
        cb_00: *id068
        sb_01: *id069
        google_contacts_id:
          type: string
          readOnly: true
        company_name: *id070
        full_name:
          type: string
          readOnly: true
          writeOnly: true
      required:
      - name
      additionalProperties: true
      x-module: Contacts
    ContactEmail:
      type: object
      properties:
        name:
          type: string
        email_id:
          type: string
          x-frappe-options: Email
        is_primary:
          type: boolean
      required:
      - email_id
      - name
      additionalProperties: true
      x-module: Contacts
    ContactPhone:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
          x-frappe-options: Phone
        is_primary_phone:
          type: boolean
        is_primary_mobile_no:
          type: boolean
      required:
      - name
      - phone
      additionalProperties: true
      x-module: Contacts
    DynamicLink:
      type: object
      properties:
        name:
          type: string
        link_doctype:
          type: string
          x-frappe-target-doctype: DocType
        link_name:
          type: string
          x-frappe-options: link_doctype
        link_title:
          type: string
          readOnly: true
      required:
      - link_doctype
      - link_name
      - name
      additionalProperties: true
      x-module: Core
    FrappeResponse:
      type: object
      properties:
        message: {}
      required:
      - message
    FrappeError:
      type: object
      properties:
        exc_type:
          type: string
        exception:
          type: string
        _server_messages:
          type: string
        request_id:
          type: string
    ResourceListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        message: {}
    FileUploadResponse:
      type: object
      properties:
        file_url:
          type: string
        file_name:
          type: string
        message: {}
    PageInfo:
      type: object
      properties:
        limit_start:
          type: integer
        limit_page_length:
          type: integer
    RuntimeStatus:
      type: object
      properties:
        ok:
          type: boolean
        status:
          type: string
        version:
          type: integer
        erpnext_version:
          type: string
        sha256:
          type: string
        drift_count:
          type: integer
      required:
      - ok
    HealthResponse:
      type: object
      properties:
        message:
          type: object
          properties:
            ok:
              type: boolean
            app:
              type: string
            site:
              type: string
            frappe_version:
              type:
              - string
              - 'null'
            installed_apps:
              type: array
              items:
                type: string
            bootstrap:
              $ref: '#/components/schemas/RuntimeStatus'
            config:
              $ref: '#/components/schemas/RuntimeStatus'
            policy:
              $ref: '#/components/schemas/RuntimeStatus'
            configuration_bundle:
              $ref: '#/components/schemas/RuntimeStatus'
          required:
          - ok
          - app
          - bootstrap
          - config
          - policy
          - configuration_bundle
      required:
      - message
    BankTransactionAllocation:
      type: object
      properties:
        payment_document:
          type: string
          enum:
          - Payment Entry
          - Journal Entry
        payment_entry:
          type: string
        allocated_amount:
          type: number
          minimum: 0
      required:
      - payment_document
      - payment_entry
      additionalProperties: false
    BankTransactionReconcileRequest:
      type: object
      properties:
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/BankTransactionAllocation'
          minItems: 1
      required:
      - allocations
      additionalProperties: false
x-contract:
  runtime:
    source_of_truth: erpnext
    api_style: frappe-native
    openapi_version: 3.1.0
    server_url: http://127.0.0.1:8080
    group_by: module
    public_module_routes: true
    include_whitelisted_methods: true
    include_doctype_metadata: false
    typed_doctypes:
    - Address
    - Contact
    - Contact Email
    - Contact Phone
    - Dynamic Link
    typed_modules:
    - Accounts
    - Assets
    - Automation
    - Bulk Transaction
    - Buying
    - CRM
    - Communication
    - Contacts
    - Core
    - Custom
    - Desk
    - EDI
    - ERPNext Integrations
    - Email
    - Geo
    - Integrations
    - Maintenance
    - Manufacturing
    - Printing
    - Projects
    - Quality Management
    - Regional
    - Selling
    - Setup
    - Stock
    - Subcontracting
    - Support
    - Telephony
    - Utilities
    - Website
    - Workflow
    public_modules:
    - Accounts
    - Assets
    - Buying
    - CRM
    - Contacts
    - Selling
    - Stock
    document_actions:
    - doctype: Asset
      module: Assets
      actions:
      - submit
      - cancel
    - doctype: Asset Capitalization
      module: Assets
      actions:
      - submit
      - cancel
    - doctype: Asset Movement
      module: Assets
      actions:
      - submit
      - cancel
    - doctype: Asset Repair
      module: Assets
      actions:
      - submit
      - cancel
    - doctype: Asset Value Adjustment
      module: Assets
      actions:
      - submit
      - cancel
    - doctype: Sales Invoice
      module: Accounts
      actions:
      - submit
      - cancel
    - doctype: Purchase Invoice
      module: Accounts
      actions:
      - submit
      - cancel
    - doctype: Sales Order
      module: Selling
      actions:
      - submit
      - cancel
    - doctype: Purchase Order
      module: Buying
      actions:
      - submit
      - cancel
    - doctype: Material Request
      module: Stock
      actions:
      - submit
      - cancel
    - doctype: Purchase Receipt
      module: Stock
      actions:
      - submit
      - cancel
    - doctype: Stock Entry
      module: Stock
      actions:
      - submit
      - cancel
    - doctype: Journal Entry
      module: Accounts
      actions:
      - submit
      - cancel
    - doctype: Payment Request
      module: Accounts
      actions:
      - submit
      - cancel
    - doctype: Payment Order
      module: Accounts
      actions:
      - submit
      - cancel
    - doctype: Payment Entry
      module: Accounts
      actions:
      - submit
      - cancel
    - doctype: Bank Transaction
      module: Accounts
      actions:
      - submit
      - cancel
    custom_actions:
    - doctype: Bank Transaction
      module: Accounts
      action: reconcile
      operation_id: reconcileBankTransaction
      path_suffix: reconcile
      handler: letron_api.accounts_reconciliation.reconcile_bank_transaction
    - doctype: Bank Transaction
      module: Accounts
      action: unreconcile
      operation_id: unreconcileBankTransaction
      path_suffix: unreconcile
      handler: letron_api.accounts_reconciliation.unreconcile_bank_transaction
    - doctype: Bank Transaction Rule
      module: Accounts
      action: run-evaluation
      operation_id: runBankTransactionRules
      path_suffix: run-evaluation
      handler: letron_api.banking.run_rule_evaluation
    custom_routes:
    - module: Accounts
      resource: bank-reconciliation
      method: GET
      path: /api/v1/accounts/bank-reconciliation/transactions
      operation: list
      operation_id: listBankReconciliationTransactions
      handler: letron_api.banking.reconciliation_transactions
    - module: Accounts
      resource: bank-reconciliation
      method: GET
      path: /api/v1/accounts/bank-reconciliation/balance
      operation: read
      operation_id: getBankReconciliationBalance
      handler: letron_api.banking.reconciliation_balance
    - module: Accounts
      resource: bank-reconciliation
      method: GET
      path: /api/v1/accounts/bank-reconciliation/linked-payments
