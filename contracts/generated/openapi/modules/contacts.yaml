            config:
              $ref: '#/components/schemas/RuntimeStatus'
            policy:
              $ref: '#/components/schemas/RuntimeStatus'
            configuration_bundle:
              $ref: '#/components/schemas/RuntimeStatus'
          required:
          - ok
          - app
          - bootstrap
          - config
          - policy
          - configuration_bundle
      required:
      - message
    BankTransactionAllocation:
      type: object
      properties:
        payment_document:
          type: string
          enum:
          - Payment Entry
          - Journal Entry
        payment_entry:
          type: string
        allocated_amount:
          type: number
          minimum: 0
      required:
      - payment_document
      - payment_entry
      additionalProperties: false
    BankTransactionReconcileRequest:
      type: object
      properties:
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/BankTransactionAllocation'
          minItems: 1
      required:
      - allocations
      additionalProperties: false
    PurchaseOrchestrationRequest: &id024
      type: object
      additionalProperties: false
      required:
      - material_request
      - suppliers
      properties:
        material_request:
          type: object
          additionalProperties: false
          required:
          - material_request_type
          - company
          - transaction_date
          - items
          properties:
            material_request_type:
              type: string
              enum:
              - Purchase
              - Material Transfer
              - Material Issue
              - Manufacture
            company:
              type: string
            transaction_date:
              type: string
              format: date
            schedule_date:
              type: string
              format: date
            title:
              type: string
            items:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required:
                - item_code
                - qty
                - schedule_date
                - warehouse
                properties:
                  item_code:
                    type: string
                  qty:
                    type: number
                    exclusiveMinimum: 0
                  schedule_date:
                    type: string
                    format: date
                  warehouse:
                    type: string
                  uom:
                    type: string
                  rate:
                    type: number
                    minimum: 0
        suppliers:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        justification:
          type: string
    PurchaseOrchestrationResponse: &id025
      type: object
      additionalProperties: true
      required:
      - id
      - status
      properties:
        id:
          type: string
        status:
          type: string
    AddressWrite:
      type: object
