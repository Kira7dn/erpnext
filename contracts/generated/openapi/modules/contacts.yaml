components:
  securitySchemes:
    frappeToken:
      type: apiKey
      in: header
      name: Authorization
      description: 'Frappe token authentication: token api_key:api_secret'
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: false
      schema:
        type: string
  schemas:
    Address:
      type: object
      properties:
        name:
          type: string
        address_details:
          type: string
          x-frappe-options: fa fa-map-marker
        address_title:
          type: string
        address_type:
          type: string
          enum:
          - Billing
          - Shipping
          - Office
          - Personal
          - Plant
          - Postal
          - Shop
          - Subsidiary
          - Warehouse
          - Current
          - Permanent
          - Other
        address_line1:
          type: string
        address_line2:
          type: string
        city:
          type: string
        county:
          type: string
        state:
          type: string
        country:
          type: string
          x-frappe-target-doctype: Country
        pincode:
          type: string
        column_break0:
          type: string
        email_id:
          type: string
          x-frappe-options: Email
        phone:
          type: string
          x-frappe-options: Phone
        fax:
          type: string
        is_primary_address:
          type:
          - boolean
          - integer
          minimum: 0
          maximum: 1
        is_shipping_address:
          type:
          - boolean
          - integer
          minimum: 0
          maximum: 1
        disabled:
          type:
          - boolean
          - integer
          minimum: 0
          maximum: 1
        linked_with:
          type: string
          x-frappe-options: fa fa-pushpin
        links:
          type: array
          items:
            $ref: '#/components/schemas/DynamicLink'
      required:
      - address_line1
      - address_type
      - city
      - country
      - name
      additionalProperties: true
      x-module: Contacts
    Contact:
      type: object
      properties:
        name:
          type: string
        contact_section:
          type: string
          x-frappe-options: fa fa-user
        first_name:
          type: string
        last_name:
          type: string
        email_id:
          type: string
          x-frappe-options: Email
          readOnly: true
        user:
          type: string
          x-frappe-target-doctype: User
        cb00:
          type: string
        status:
          type: string
          enum:
          - Passive
          - Open
          - Replied
        salutation:
          type: string
          x-frappe-target-doctype: Salutation
        gender:
          type: string
          x-frappe-target-doctype: Gender
        phone:
          type: string
          x-frappe-options: Phone
          readOnly: true
        image:
          type: string
          writeOnly: true
        contact_details:
          type: string
          x-frappe-options: fa fa-pushpin
        is_primary_contact:
          type:
          - boolean
          - integer
          minimum: 0
          maximum: 1
        links:
          type: array
          items:
            $ref: '#/components/schemas/DynamicLink'
        more_info:
          type: string
          x-frappe-options: fa fa-file-text
        department:
          type: string
        designation:
          type: string
        unsubscribed:
          type:
          - boolean
          - integer
          minimum: 0
          maximum: 1
        middle_name:
          type: string
        sb_00:
          type: string
        email_ids:
          type: array
          items:
            $ref: '#/components/schemas/ContactEmail'
        address:
          type: string
          x-frappe-target-doctype: Address
        phone_nos:
          type: array
          items:
            $ref: '#/components/schemas/ContactPhone'
        mobile_no:
          type: string
          x-frappe-options: Phone
          readOnly: true
        pulled_from_google_contacts:
          type:
          - boolean
          - integer
          minimum: 0
          maximum: 1
          readOnly: true
        sync_with_google_contacts:
          type:
          - boolean
          - integer
          minimum: 0
          maximum: 1
        google_contacts:
          type: string
          x-frappe-target-doctype: Google Contacts
        cb_00:
          type: string
        sb_01:
          type: string
        google_contacts_id:
          type: string
          readOnly: true
        company_name:
          type: string
        full_name:
          type: string
          readOnly: true
          writeOnly: true
      required:
      - name
      additionalProperties: true
      x-module: Contacts
    ContactEmail:
      type: object
      properties:
        name:
          type: string
        email_id:
          type: string
          x-frappe-options: Email
        is_primary:
          type:
          - boolean
          - integer
          minimum: 0
          maximum: 1
      required:
      - email_id
      - name
      additionalProperties: true
      x-module: Contacts
    ContactPhone:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
          x-frappe-options: Phone
        is_primary_phone:
          type:
          - boolean
          - integer
          minimum: 0
          maximum: 1
        is_primary_mobile_no:
          type:
          - boolean
          - integer
          minimum: 0
          maximum: 1
      required:
      - name
      - phone
      additionalProperties: true
      x-module: Contacts
    DynamicLink:
      type: object
      properties:
        name:
          type: string
        link_doctype:
          type: string
          x-frappe-target-doctype: DocType
        link_name:
          type: string
          x-frappe-options: link_doctype
        link_title:
          type: string
          readOnly: true
      required:
      - link_doctype
      - link_name
      - name
      additionalProperties: true
      x-module: Core
    FrappeResponse:
      type: object
      properties:
        message: {}
      required:
      - message
    FrappeError:
      type: object
      properties:
        exc_type:
          type: string
        exception:
          type: string
        _server_messages:
          type: string
        request_id:
          type: string
    ResourceListResponse:
      type: object
      properties:
        data:
          type: array
