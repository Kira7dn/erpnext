          type: string
        version:
          type: integer
        erpnext_version:
          type: string
        sha256:
          type: string
        drift_count:
          type: integer
      required:
      - ok
    HealthResponse:
      type: object
      properties:
        message:
          type: object
          properties:
            ok:
              type: boolean
            app:
              type: string
            site:
              type: string
            frappe_version:
              type:
              - string
              - 'null'
            installed_apps:
              type: array
