openapi: 3.1.0
info:
  title: Letron ERPNext Files API
  version: 0.1.0
servers:
- url: http://127.0.0.1:8080
tags:
- name: Typed Resource API
- name: Whitelisted methods
- name: Metadata
- name: Files
security:
- frappeToken: []
paths:
  /api/v1/files/attachments:
    post:
      tags:
      - 'Module: Files'
      - Business routes
      summary: createAttachment
      operationId: createAttachment
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Business route response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FrappeResponse'
        '400':
          description: Invalid request
          content: &id001
            application/json:
              schema:
                $ref: '#/components/schemas/FrappeError'
        '401':
          description: Authentication required
          content: *id001
        '403':
          description: Permission denied
          content: *id001
        '404':
          description: Resource not found
          content: *id001
        '409':
          description: Idempotency or optimistic concurrency conflict
          content: *id001
        '417':
          description: Native Frappe validation failure
          content: *id001
        '429':
          description: Rate limited
          content: *id001
        '500':
          description: Server or rollback failure
          content: *id001
      x-frappe-handler: letron_api.delivery.attachments.create_attachment
      x-public-operation: create
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - attached_to_doctype
              - attached_to_name
              properties:
                file:
                  type: string
                  format: binary
                attached_to_doctype:
                  type: string
                attached_to_name:
                  type: string
                is_private:
                  type: string
      x-test-status: passed
      x-test-level: docker-runtime
      x-test-evidence:
        suite: extended-api
        test: tests/integration/test_extended_api_runtime.py::test_extended_auth_system_resources_and_business_flows
components:
  securitySchemes:
    frappeToken:
      type: apiKey
      in: header
      name: Authorization
      description: 'Frappe token authentication: token api_key:api_secret'
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: false
      schema:
        type: string
  schemas:
    FrappeResponse:
      type: object
      properties:
        message: {}
      required:
      - message
    FrappeError:
      type: object
      properties:
        exc_type:
          type: string
        exception:
          type: string
        _server_messages:
          type: string
        request_id:
          type: string
    ResourceListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
        message: {}
    FileUploadResponse:
      type: object
      properties:
        file_url:
          type: string
        file_name:
          type: string
        message: {}
    PageInfo:
      type: object
      properties:
        limit_start:
          type: integer
        limit_page_length:
          type: integer
    RuntimeStatus:
      type: object
      properties:
        ok:
          type: boolean
        status:
          type: string
        version:
          type: integer
        erpnext_version:
          type: string
        sha256:
          type: string
        drift_count:
          type: integer
      required:
      - ok
    HealthResponse:
      type: object
      properties:
        message:
          type: object
          properties:
            ok:
              type: boolean
            app:
              type: string
            site:
              type: string
            frappe_version:
              type:
              - string
              - 'null'
            installed_apps:
              type: array
              items:
                type: string
            bootstrap:
              $ref: '#/components/schemas/RuntimeStatus'
            config:
              $ref: '#/components/schemas/RuntimeStatus'
            policy:
              $ref: '#/components/schemas/RuntimeStatus'
            configuration_bundle:
              $ref: '#/components/schemas/RuntimeStatus'
          required:
          - ok
          - app
          - bootstrap
          - config
          - policy
          - configuration_bundle
      required:
      - message
    BankTransactionAllocation:
      type: object
      properties:
        payment_document:
          type: string
          enum:
          - Payment Entry
          - Journal Entry
        payment_entry:
          type: string
        allocated_amount:
          type: number
          minimum: 0
      required:
      - payment_document
      - payment_entry
      additionalProperties: false
    BankTransactionReconcileRequest:
      type: object
      properties:
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/BankTransactionAllocation'
          minItems: 1
      required:
      - allocations
      additionalProperties: false
    PurchaseOrchestrationRequest: &id002
      type: object
      additionalProperties: false
      required:
      - material_request
      - suppliers
      properties:
        material_request:
          type: object
          additionalProperties: false
          required:
          - material_request_type
          - company
          - transaction_date
          - items
          properties:
            material_request_type:
              type: string
              enum:
              - Purchase
              - Material Transfer
              - Material Issue
              - Manufacture
            company:
              type: string
            transaction_date:
              type: string
              format: date
            schedule_date:
              type: string
              format: date
            title:
              type: string
            items:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required:
                - item_code
                - qty
                - schedule_date
                - warehouse
                properties:
                  item_code:
                    type: string
                  qty:
                    type: number
                    exclusiveMinimum: 0
                  schedule_date:
                    type: string
                    format: date
                  warehouse:
                    type: string
                  uom:
                    type: string
                  rate:
                    type: number
                    minimum: 0
        suppliers:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
        justification:
          type: string
    PurchaseOrchestrationResponse: &id003
      type: object
      additionalProperties: true
      required:
      - id
      - status
      properties:
        id:
          type: string
        status:
          type: string
