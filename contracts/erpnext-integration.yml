transport:
  rest: true
  webhook: true
  realtime: true

headers:
  request_id: X-Request-Id
  idempotency_key: X-Idempotency-Key

documentation:
  openapi_yaml: contracts/generated/openapi.yaml
  openapi_json: contracts/generated/openapi.json
  handbook: docs/ERPNext_Integration_Handbook.md

sync:
  primary_read_path: rest
  change_notification: webhook
  reconciliation: pull
  realtime_is_source_of_truth: false

auth:
  mode: configured
  scheme: frappeToken
  production_sso: later

upload:
  enabled: true
  path: /api/v1/files/attachments
  field: file
  attachment_fields: [attached_to_doctype, attached_to_name, is_private]

capabilities:
  webhook:
    declared: true
    delivery_implemented: true
    delivery: durable-outbox
    signature: hmac-sha256
    max_attempts: 3
  realtime:
    declared: true
    delivery_implemented: true
    delivery: durable-outbox
    source_of_truth: false

acceptance:
  default_status: not-tested
  suites:
    public-api:
      level: docker-runtime
      test: tests/integration/test_public_api_runtime.py::test_public_contract_and_lifecycle
    extended-api:
      level: docker-runtime
      test: tests/integration/test_extended_api_runtime.py::test_extended_auth_system_resources_and_business_flows
    accounts-reconciliation:
      level: docker-runtime
      test: tests/integration/test_accounts_reconciliation.py
    crm-preorder:
      level: docker-runtime
      test: tests/integration/test_crm_preorder.py::test_crm_preorder_contract_and_lifecycle
    stock-traceability:
