version: 1
kind: erpnext-integration-contract

runtime:
  source_of_truth: erpnext
  api_style: frappe-native
  openapi_version: 3.1.0
  server_url: ${ERPNEXT_API_URL}
  group_by: module
  public_module_routes: true
  include_whitelisted_methods: true
  include_doctype_metadata: false
  typed_doctypes: []
  typed_modules:
    - Accounts
    - Assets
    - Automation
    - Bulk Transaction
    - Buying
    - CRM
    - Communication
    - Contacts
    - Core
    - Custom
    - Desk
    - EDI
    - ERPNext Integrations
    - Email
    - Geo
    - Integrations
    - Maintenance
    - Manufacturing
    - Printing
    - Projects
    - Quality Management
    - Regional
    - Selling
    - Setup
    - Stock
    - Subcontracting
    - Support
    - Telephony
    - Utilities
    - Website
    - Workflow
  # Only business modules receive clean public /api/v1 routes. The remaining
  # typed modules stay available in catalog.json for discovery.
  public_modules:
    - Accounts
    - Assets
    - Buying
    - CRM
    - Contacts
    - Selling
    - Stock
  document_actions:
    - doctype: Asset
      module: Assets
      actions: [submit, cancel]
    - doctype: Asset Capitalization
      module: Assets
      actions: [submit, cancel]
    - doctype: Asset Movement
      module: Assets
      actions: [submit, cancel]
    - doctype: Asset Repair
      module: Assets
      actions: [submit, cancel]
    - doctype: Asset Value Adjustment
      module: Assets
      actions: [submit, cancel]
    - doctype: Sales Invoice
      module: Accounts
      actions: [submit, cancel]
    - doctype: Purchase Invoice
      module: Accounts
      actions: [submit, cancel]
    - doctype: Sales Order
      module: Selling
      actions: [submit, cancel]
    - doctype: Purchase Order
      module: Buying
      actions: [submit, cancel]
    - doctype: Material Request
      module: Stock
      actions: [submit, cancel]
    - doctype: Purchase Receipt
      module: Stock
      actions: [submit, cancel]
    - doctype: Stock Entry
      module: Stock
      actions: [submit, cancel]
    - doctype: Journal Entry
      module: Accounts
      actions: [submit, cancel]
    - doctype: Payment Request
      module: Accounts
      actions: [submit, cancel]
    - doctype: Payment Order
      module: Accounts
      actions: [submit, cancel]
    - doctype: Payment Entry
      module: Accounts
      actions: [submit, cancel]
    - doctype: Bank Transaction
      module: Accounts
      actions: [submit, cancel]
  custom_actions:
    - doctype: Bank Transaction
      module: Accounts
      action: reconcile
      operation_id: reconcileBankTransaction
      path_suffix: reconcile
      handler: letron_api.accounts_reconciliation.reconcile_bank_transaction
    - doctype: Bank Transaction
      module: Accounts
      action: unreconcile
      operation_id: unreconcileBankTransaction
      path_suffix: unreconcile
      handler: letron_api.accounts_reconciliation.unreconcile_bank_transaction
    - doctype: Bank Transaction Rule
      module: Accounts
      action: run-evaluation
      operation_id: runBankTransactionRules
      path_suffix: run-evaluation
      handler: letron_api.banking.run_rule_evaluation
  custom_routes:
    - {module: Buying, resource: purchase-orders/create-draft, method: POST, path: /api/method/letron_api.lark_po.create_draft, operation: create, operation_id: createPurchaseOrderDraftBeforeApproval, handler: letron_api.lark_po.create_draft}
    - {module: Buying, resource: purchase-orders/from-approved-lark, method: POST, path: /api/method/letron_api.lark_po.from_approved, operation: create, operation_id: createPurchaseOrderFromApprovedLark, handler: letron_api.lark_po.from_approved}
    - {module: Buying, resource: purchase-orders/update-approval-state, method: POST, path: /api/method/letron_api.lark_po.update_approval_state, operation: update, operation_id: updatePurchaseOrderApprovalState, handler: letron_api.lark_po.update_approval_state}
    - {module: Files, resource: attachments, method: POST, path: /api/v1/files/attachments, operation: create, operation_id: createAttachment, handler: letron_api.attachments.create_attachment, content_type: multipart/form-data, multipart_fields: [attached_to_doctype, attached_to_name, is_private], required_multipart_fields: [attached_to_doctype, attached_to_name]}
    - {module: Accounts, resource: bank-reconciliation, method: GET, path: /api/v1/accounts/bank-reconciliation/transactions, operation: list, operation_id: listBankReconciliationTransactions, handler: letron_api.banking.reconciliation_transactions}
    - {module: Accounts, resource: bank-reconciliation, method: GET, path: /api/v1/accounts/bank-reconciliation/balance, operation: read, operation_id: getBankReconciliationBalance, handler: letron_api.banking.reconciliation_balance}
    - {module: Accounts, resource: bank-reconciliation, method: GET, path: /api/v1/accounts/bank-reconciliation/linked-payments, operation: read, operation_id: getBankReconciliationLinkedPayments, handler: letron_api.banking.reconciliation_linked_payments}
    - {module: Accounts, resource: bank-reconciliation, method: POST, path: /api/v1/accounts/bank-reconciliation/clearance, operation: update, operation_id: updateBankReconciliationClearance, handler: letron_api.banking.reconciliation_update_clearance}
    - {module: Accounts, resource: bank-reconciliation, method: POST, path: /api/v1/accounts/bank-reconciliation/clear-clearance, operation: update, operation_id: clearBankReconciliationClearance, handler: letron_api.banking.reconciliation_clear_clearance}
    - {module: Accounts, resource: bank-reconciliation, method: POST, path: '/api/v1/accounts/bank-reconciliation/actions/{action}', operation: update, operation_id: runBankReconciliationAction, handler: letron_api.banking.reconciliation_action}
    - {module: Accounts, resource: reports, method: GET, path: /api/v1/accounts/reports/report, operation: read, operation_id: runAccountsReport, handler: letron_api.banking.report}
    - {module: Accounts, resource: statement-imports, method: GET, path: /api/v1/accounts/statement-imports, operation: list, operation_id: listStatementImports, handler: letron_api.banking.statement_imports}
    - {module: Accounts, resource: statement-imports, method: POST, path: /api/v1/accounts/statement-imports, operation: create, operation_id: createStatementImport, handler: letron_api.banking.statement_import_create}
    - {module: Accounts, resource: statement-imports, method: POST, path: '/api/v1/accounts/statement-imports/upload', operation: create, operation_id: uploadStatementImport, handler: letron_api.banking.statement_import_upload, content_type: multipart/form-data}
    - {module: Accounts, resource: statement-imports, method: GET, path: '/api/v1/accounts/statement-imports/{name}', operation: read, operation_id: getStatementImport, handler: letron_api.banking.statement_import_get}
    - {module: Accounts, resource: statement-imports, method: PUT, path: '/api/v1/accounts/statement-imports/{name}', operation: update, operation_id: updateStatementImport, handler: letron_api.banking.statement_import_update}
    - {module: Accounts, resource: statement-imports, method: GET, path: '/api/v1/accounts/statement-imports/{name}/details', operation: read, operation_id: getStatementImportDetails, handler: letron_api.banking.statement_details}
    - {module: Accounts, resource: statement-imports, method: POST, path: '/api/v1/accounts/statement-imports/{name}/update-pdf-tables', operation: update, operation_id: updateStatementImportPdfTables, handler: letron_api.banking.statement_update_pdf_tables}
    - {module: Accounts, resource: statement-imports, method: POST, path: '/api/v1/accounts/statement-imports/{name}/reextract-pdf-table', operation: update, operation_id: reextractStatementImportPdfTable, handler: letron_api.banking.statement_reextract_pdf_table}
    - {module: Accounts, resource: statement-imports, method: POST, path: '/api/v1/accounts/statement-imports/{name}/set-pdf-table-header', operation: update, operation_id: setStatementImportPdfTableHeader, handler: letron_api.banking.statement_set_pdf_table_header}
    - {module: Accounts, resource: statement-imports, method: POST, path: '/api/v1/accounts/statement-imports/{name}/update-column-mapping', operation: update, operation_id: updateStatementImportColumnMapping, handler: letron_api.banking.statement_update_column_mapping}
    - {module: Accounts, resource: statement-imports, method: POST, path: '/api/v1/accounts/statement-imports/{name}/set-header-index', operation: update, operation_id: setStatementImportHeaderIndex, handler: letron_api.banking.statement_set_header_index}
    - {module: Accounts, resource: settings, method: GET, path: /api/v1/accounts/settings, operation: read, operation_id: getAccountsSettings, handler: letron_api.banking.accounts_settings}
    - {module: Accounts, resource: settings, method: PUT, path: /api/v1/accounts/settings, operation: update, operation_id: updateAccountsSettings, handler: letron_api.banking.accounts_settings_update}
    - {module: Assets, resource: actions, method: POST, path: '/api/v1/assets/actions/{action}', operation: update, operation_id: runAssetAction, handler: letron_api.assets.asset_action}
    - {module: Assets, resource: reports, method: GET, path: /api/v1/assets/reports/report, operation: read, operation_id: runAssetReport, handler: letron_api.assets.asset_report}
    - {module: Assets, resource: dashboard, method: GET, path: /api/v1/assets/dashboard, operation: read, operation_id: getAssetDashboard, handler: letron_api.assets.asset_dashboard}
