services:
  event-consumer:
    image: python:3.14-alpine
    restart: ${RESTART_POLICY}
    networks: [frappe_network]
    command: [python, /app/staging_consumer.py]
    environment:
      LETRON_CONSUMER_DATABASE: /data/events.db
      LETRON_CONSUMER_PORT: "8090"
      LETRON_WEBHOOK_SECRET: ${LETRON_WEBHOOK_SECRET:-}
      LETRON_REALTIME_TOKEN: ${LETRON_REALTIME_TOKEN:-}
    ports: ["${LETRON_CONSUMER_PORT:-8091}:8090"]
    volumes:
      - ./staging_consumer.py:/app/staging_consumer.py:ro
      - event-consumer-data:/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 20

  queue-short:
    depends_on:
      event-consumer: {condition: service_healthy}

  scheduler:
    depends_on:
      event-consumer: {condition: service_healthy}

volumes:
  event-consumer-data: {name: "${PROJECT_NAME:-erpnext}-event-consumer-data"}
