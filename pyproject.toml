[project]
name = "erpnext-workspace-tools"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
workspace-api = "workspace_api.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "PyYAML>=6.0",
    "ruff>=0.8",
    "ty>=0.0.1",
]

[tool.ty.environment]
python = ".venv"
python-version = "3.14"
extra-paths = [".cache/frappe-v16"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# frappe is provided by the Frappe/ERPNext Docker image at runtime.
# It is intentionally not installed into the root host environment.
