[project]
name = "erpnext-workspace-tools"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
api-generator = "lib.api_generator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lib"]

[dependency-groups]
dev = [
    "openapi-spec-validator>=0.9.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.4.0",
    "PyYAML>=6.0",
    "ruff>=0.8",
    "ty>=0.0.1",
]

[tool.ty.environment]
python = ".venv"
python-version = "3.14"
extra-paths = [".cache/frappe-v16", "apps/letron_api"]

[tool.pytest.ini_options]
pythonpath = [".", "apps/letron_api"]
testpaths = ["tests"]
addopts = "-m 'not integration'"
timeout = 70
timeout_method = "thread"
markers = [
    "integration: requires the local ERPNext Docker runtime",
    "external_delivery: requires the configured staging event consumer",
]

# frappe is provided by the Frappe/ERPNext Docker image at runtime.
# It is intentionally not installed into the root host environment.
