version: 3
erpnext_version: 16.31.1
runtime: {environment: local, image: frappe/erpnext:v16.31.1, platform: linux/amd64, restart_policy: unless-stopped}
project: {name: erpnext-acceptance, http_port: 18080}
integration: {app_name: letron_api, app_path: apps/letron_api, install_on_site: true}
database:
  image: mariadb:11.8
  host: db
  port: 3306
  root_user: root
  root_password: ${LETRON_BOOTSTRAP_PASSWORD}
  charset: utf8mb4
  collation: utf8mb4_unicode_ci
  volume: erpnext-acceptance-db-data
redis:
  cache: redis-cache:6379
  queue: redis-queue:6379
  socketio: redis-queue:6379
  cache_image: redis:6.2-alpine
  queue_image: redis:6.2-alpine
site: {name: frontend-acceptance.local, header: frontend-acceptance.local, database_type: mariadb, admin_password: "${LETRON_BOOTSTRAP_PASSWORD}"}
developer: {mode: true, allow_tests: true, request_timeout: 120}
frontend: {backend: "backend:8000", websocket: "websocket:9000", upload_size: 50m, proxy_timeout: 120}
workers:
  short_command: "bench worker --queue short"
  short_replicas: 2
  long_command: "bench worker --queue long,default"
  scheduler_command: "bench schedule"
email: {enabled: false, host: smtp.example.local, port: 587, username: change-me, password: "${SMTP_PASSWORD}", use_tls: true}
storage: {sites_volume: erpnext-acceptance-sites, logs_volume: erpnext-acceptance-logs, redis_queue_volume: erpnext-acceptance-redis-queue-data, backup_volume: erpnext-acceptance-backups}
backup: {enabled: false, interval_hours: 24, retention_days: 14, with_files: true}
credentials: {production_like: false}
delivery:
  enabled: false
  webhook_url: http://event-consumer:8090/webhook
  webhook_secret: ${LETRON_WEBHOOK_SECRET}
  webhook_timeout_ms: 5000
  realtime_url: http://event-consumer:8090/realtime
  realtime_token: ${LETRON_REALTIME_TOKEN}
system_settings:
  language: vi
  time_zone: Asia/Ho_Chi_Minh
  date_format: yyyy-mm-dd
  number_format: "#,###.##"
  enable_password_policy: 1
  session_expiry: "170:00"
