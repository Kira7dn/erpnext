## POLICY HIERARCHY
## -----------------
# [A] Metadata
version: 2
scope_version: 1
erpnext_version: 16.31.1

# [B] Assets
assets: {}

# [C] Bootstrap defaults
bootstrap:
  # Company và dữ liệu nền bắt buộc để khởi tạo tenant Việt Nam.
  company:
    # Tên pháp lý của Company.
    name: Letron Việt Nam
    # Mã viết tắt dùng trong Account và chứng từ.
    abbreviation: LTVN
    # Quốc gia đăng ký Company.
    country: Vietnam
    # Base Currency dùng cho sổ cái và báo cáo.
    currency: VND
    # Business Domain; dùng giá trị ERPNext hỗ trợ.
    # 🔹 ENUM vận hành: Manufacturing | Retail | Services | Distribution
    domain: Distribution
    # Chart of Accounts Template khi khởi tạo Company.
    chart_of_accounts: Standard

documents:
  - doctype: Accounting Period
    name: FY 2026 - LTVN
    state: present

    # Kỳ kế toán chính thức mà ERP được phép ghi nhận giao dịch cho Company.
    fields:
      # Tên kỳ; phải trùng với name của record Accounting Period.
      period_name: FY 2026 - LTVN
      # Ngày bắt đầu kỳ kế toán, bao gồm cả ngày này.
      start_date: 2026-01-01
      # Ngày kết thúc kỳ hiện hành; ERPNext không cho phép ngày tương lai.
      end_date: 2026-08-14
      # Company sở hữu kỳ kế toán.
      company: Letron Việt Nam
      # 1 = vô hiệu hóa kỳ; 0 = kỳ đang được sử dụng.
      # 🔹 ENUM: 0 | 1
      disabled: 0
      # Role được phép bypass giới hạn kỳ; null = không role nào được bypass.
      exempted_role: null
      # Các DocType bị khóa trong kỳ; closed: 0 = đang mở, 1 = đã khóa.
      closed_documents:
        - document_type: Sales Invoice
          # 🔹 ENUM: 0 | 1
          closed: 0
        - document_type: Purchase Invoice
          # 🔹 ENUM: 0 | 1
          closed: 0
        - document_type: Journal Entry
          # 🔹 ENUM: 0 | 1
          closed: 0
        - document_type: Payment Entry
          # 🔹 ENUM: 0 | 1
          closed: 0
        - document_type: Purchase Receipt
          # 🔹 ENUM: 0 | 1
          closed: 0

  - doctype: Accounts Settings
    name: Accounts Settings
    state: present

    # [D.01] Kiểm soát kế toán, tỷ giá và Tax.
    fields:
      # Cho phép một Party Account dùng cho nhiều Currency trong invoice.
      # 1 = cho phép; 0 = không cho phép.
      # 🔹 ENUM: 0 | 1
      allow_multi_currency_invoices_against_single_party_account: 0

      # Cho phép dùng tỷ giá neo trong giao dịch.
      # 1 = cho phép; 0 = không cho phép.
      # 🔹 ENUM: 0 | 1
      allow_pegged_currencies_exchange_rates: 0

      # Tự lấy Tax từ Item Tax Template khi tạo transaction.
      # 1 = tự lấy; 0 = không tự lấy.
      # 🔹 ENUM: 0 | 1
      add_taxes_from_item_tax_template: 1

      # Tự lấy Tax/Charge từ Tax and Charges Template.
      # 1 = tự lấy; 0 = không tự lấy.
      # 🔹 ENUM: 0 | 1
      add_taxes_from_taxes_and_charges_template: 0

      # Không cho phép dùng Exchange Rate quá thời hạn.
      # 1 = cho phép rate cũ; 0 = chỉ dùng rate trong stale_days.
      # 🔹 ENUM: 0 | 1
      allow_stale: 0

      # Cách tính số ngày cho Deferred Accounting.
      # 🔹 ENUM: Days | Months
      book_deferred_entries_based_on: Days

      # Tự động ghi nhận Deferred Accounting entries.
      # 1 = tự động; 0 = xử lý thủ công.
      # 🔹 ENUM: 0 | 1
      automatically_process_deferred_accounting_entry: 1

      # Tự động ghi Asset Depreciation Entry.
      # 1 = tự động; 0 = xử lý thủ công.
      # 🔹 ENUM: 0 | 1
      book_asset_depreciation_entry_automatically: 1

      # Ghi nhận Stock Expense vào General Ledger.
      # 1 = bật; 0 = tắt.
      # 🔹 ENUM: 0 | 1
      book_stock_expense_gl_entries: 0

      # Ghi nhận khoản lỗ do chiết khấu Tax vào GL.
      # 1 = bật; 0 = tắt.
      # 🔹 ENUM: 0 | 1
      book_tax_discount_loss: 0

      # Cách tính khấu hao theo tổng số ngày của Asset.
      # 1 = dùng tổng ngày; 0 = dùng cách mặc định.
      # 🔹 ENUM: 0 | 1
      calculate_depr_using_total_days: 0

      # Không cho phép trùng số hóa đơn của Supplier.
      # 1 = kiểm tra; 0 = không kiểm tra.
      # 🔹 ENUM: 0 | 1
      check_supplier_invoice_uniqueness: 1

      # Xác nhận trước khi thay đổi Posting Date đã khóa.
      # 1 = yêu cầu xác nhận; 0 = không yêu cầu.
      # 🔹 ENUM: 0 | 1
      confirm_before_resetting_posting_date: 1

      # Địa chỉ dùng để xác định Tax Category.
      # 🔹 ENUM: Billing Address | Shipping Address
      determine_address_tax_category_from: Billing Address

      # Khóa Immutable Ledger để bảo vệ lịch sử bút toán.
      # 1 = bật; 0 = tắt.
      # 🔹 ENUM: 0 | 1
      enable_immutable_ledger: 1

      # Bật Accounting Dimensions trong chứng từ.
      # 1 = bật; 0 = tắt.
      # 🔹 ENUM: 0 | 1
      enable_accounting_dimensions: 0

      # Ngày ghi nhận Exchange Gain/Loss.
      # 🔹 ENUM: Invoice | Payment | Reconciliation Date
      exchange_gain_loss_posting_date: Payment

      # Số ngày trong Ageing Report được phân tách thành các bucket.
      # Nhập danh sách số ngày, ví dụ: 30, 60, 90, 120.
      default_ageing_range: 30, 60, 90, 120

      # Giữ nguyên cách tính thuế theo từng dòng để kiểm soát rounding.
      # 1 = bật; 0 = dùng cách tính mặc định.
      # 🔹 ENUM: 0 | 1
      round_row_wise_tax: 0

      # Cho phép bỏ qua Opening Entry check khi lập báo cáo.
      # 1 = bỏ qua; 0 = kiểm tra.
      # 🔹 ENUM: 0 | 1
      ignore_is_opening_check_for_reporting: 0

      # Cách xử lý khi tỷ giá giao dịch nội bộ thay đổi.
      # 🔹 ENUM: Stop | Warn
      maintain_same_rate_action: Stop

      # Cách lấy dữ liệu cho Receivable/Payable report.
      # 🔹 ENUM: Buffered Cursor | UnBuffered Cursor
      receivable_payable_fetch_method: Buffered Cursor

      # Số ngày tối đa mà Exchange Rate được coi là còn hiệu lực.
      # Chỉ áp dụng khi allow_stale = 0.
      stale_days: 1

      # Số ngày cho phép đối chiếu Transfer/Payment gần nhau.
      transfer_match_days: 3

      # Các DocType thay đổi Account sẽ kích hoạt Repost Valuation.
      # Xóa dòng nếu không muốn repost khi Account thay đổi.
      repost_allowed_types:
        # Account change có thể làm thay đổi GL/Stock Valuation của chứng từ.
        - document_type: Sales Invoice
        - document_type: Purchase Invoice
        - document_type: Journal Entry
        - document_type: Payment Entry
        - document_type: Purchase Receipt

  - doctype: Buying Settings
    name: Buying Settings
    state: present

    # Các control Buying ảnh hưởng tính hợp lệ của chứng từ mua.
    fields:
      # Bắt buộc Purchase Receipt trước Purchase Invoice.
      # 🔹 ENUM: Yes | No
      pr_required: "Yes"

      # Bắt buộc Purchase Order trước Purchase Receipt/Invoice.
      # 🔹 ENUM: Yes | No
      po_required: "Yes"

      # Cho phép tính giá trị hàng bị từ chối vào Purchase Invoice.
      # 1 = cho phép; 0 = không cho phép.
      # 🔹 ENUM: 0 | 1
      bill_for_rejected_quantity_in_purchase_invoice: 1

      # Cập nhật Valuation Rate cho vật tư bị từ chối.
      # 1 = cập nhật; 0 = không cập nhật.
      # 🔹 ENUM: 0 | 1
      set_valuation_rate_for_rejected_materials: 0

  - doctype: Currency Exchange Settings
    name: Currency Exchange Settings
    state: present

    # Provider/API lấy tỷ giá là runtime configuration của Headless BE.
    fields: {}

  - doctype: Delivery Settings
    name: Delivery Settings
    state: present

    # Email, attachment và dispatch behavior do Headless BE xử lý mặc định.
    fields: {}

  - doctype: Item Variant Settings
    name: Item Variant Settings
    state: present

    # Item Variant behavior không phải policy pháp lý; dùng default ERPNext.
    fields: {}

  - doctype: Ledger Health Monitor
    name: Ledger Health Monitor
    state: present

    # [D.06] Kiểm soát và phát hiện sai lệch sổ kế toán.
    fields:
      # Company được kiểm tra; [] = không giới hạn Company trong monitor.
      companies: []

      # Kiểm tra Debit/Credit của từng Voucher có cân bằng không.
      # 1 = bật; 0 = tắt.
      # 🔹 ENUM: 0 | 1
      debit_credit_mismatch: 0

      # Bật scheduler Ledger Health Monitor.
      # 1 = bật; 0 = tắt.
      # 🔹 ENUM: 0 | 1
      enable_health_monitor: 0

      # So sánh General Ledger với Payment Ledger.
      # 1 = bật; 0 = tắt.
      # 🔹 ENUM: 0 | 1
      general_and_payment_ledger_mismatch: 0

      # Số ngày lùi lại để kiểm tra dữ liệu; ví dụ 60 = 60 ngày gần nhất.
      monitor_for_last_x_days: 60

  - doctype: Pegged Currencies
    name: Pegged Currencies
    state: present

    # Tỷ giá neo là dữ liệu runtime; nếu cần dùng, Headless BE quản lý riêng.
    fields: {}

  - doctype: Selling Settings
    name: Selling Settings
    state: present

    # Feature Selling không thuộc policy pháp lý; Headless BE dùng default.
    fields: {}

  - doctype: Stock Settings
    name: Stock Settings
    state: present

    # [D.09] Kiểm soát tồn kho ảnh hưởng giá vốn và tính đúng đắn sổ sách.
    fields:
      # Không cho phép xuất kho khi tồn kho âm.
      # 1 = cho phép âm; 0 = chặn.
      # 🔹 ENUM: 0 | 1
      allow_negative_stock: 0

      # Không cho phép tồn kho âm riêng đối với Batch.
      # 1 = cho phép; 0 = chặn.
      # 🔹 ENUM: 0 | 1
      allow_negative_stock_for_batch: 0

      # Hành động khi Quality Inspection chưa được Submit.
      # 🔹 ENUM: Stop | Warn
      action_if_quality_inspection_is_not_submitted: Stop

      # Hành động khi Quality Inspection bị Reject.
      # 🔹 ENUM: Stop | Warn
      action_if_quality_inspection_is_rejected: Stop

      # Cho phép giao một phần số lượng đã được reserve.
      # 1 = cho phép; 0 = không cho phép.
      # 🔹 ENUM: 0 | 1
      allow_partial_reservation: 1

      # Cho phép tạo Serial and Batch Bundle tự động khi xuất kho.
      # 1 = tự động; 0 = thủ công.
      # 🔹 ENUM: 0 | 1
      auto_create_serial_and_batch_bundle_for_outward: 1

      # Bật quản lý Serial/Batch cho Item.
      # 1 = bật; 0 = tắt.
      # 🔹 ENUM: 0 | 1
      enable_serial_and_batch_no_for_item: 0

      # Phương pháp tính giá xuất kho và giá vốn.
      # 🔹 ENUM: FIFO | Moving Average | LIFO
      valuation_method: FIFO

      # Ngày bắt đầu khóa sửa Stock transaction.
      # null = không khóa theo ngày cố định.
      stock_frozen_upto: null

      # Số ngày gần nhất không được sửa Stock transaction.
      # 0 = không khóa theo số ngày.
      stock_frozen_upto_days: 0

      # Role được phép tạo/sửa giao dịch lùi ngày.
      # null = không cấp Role đặc biệt; nếu dùng phải là Role đã tồn tại.
      role_allowed_to_create_edit_back_dated_transactions: null

      # Role được phép vượt quá số lượng giao/nhận.
      # null = không cấp Role đặc biệt; nếu dùng phải là Role đã tồn tại.
      role_allowed_to_over_deliver_receive: null

      # Mức cho phép nhận vượt số lượng đặt hàng (%).
      over_delivery_receipt_allowance: 0.0

      # Mức cho phép xuất vượt số lượng đặt hàng (%).
      over_picking_allowance: 0.0

      # Cách chọn Serial/Batch khi xuất kho.
      # 🔹 ENUM: FIFO | LIFO | Expiry
      pick_serial_and_batch_based_on: FIFO

  - doctype: Stock Reposting Settings
    name: Stock Reposting Settings
    state: present

    # Scheduler/parallel reposting là runtime feature; Headless BE dùng default.
    fields: {}

  # Cost Center gốc của Company; ERPNext yêu cầu node gốc có cùng tên Company.
  - doctype: Cost Center
    name: Letron Việt Nam - LTVN
    state: present
    fields:
      cost_center_name: Letron Việt Nam
      company: Letron Việt Nam
      parent_cost_center: null
      # 🔹 ENUM: 0 | 1
      is_group: 1
      # 🔹 ENUM: 0 | 1
      disabled: 0

  # Cost Center ledger dùng để ghi nhận VAT/Tax trên các Tax Template.
  - doctype: Cost Center
    name: Main - LTVN
    state: present
    fields:
      cost_center_name: Main
      company: Letron Việt Nam
      parent_cost_center: Letron Việt Nam - LTVN
      # 🔹 ENUM: 0 | 1
      is_group: 0
      # 🔹 ENUM: 0 | 1
      disabled: 0

  - doctype: Item Tax Template
    name: Vietnam Tax - LTVN
    state: present

    # [D.12] Tax áp dụng theo Item; giữ các field ảnh hưởng VAT.
    fields:
      # Company sở hữu Item Tax Template.
      company: Letron Việt Nam

      # Vô hiệu hóa template.
      # 1 = không áp dụng; 0 = được dùng.
      # 🔹 ENUM: 0 | 1
      disabled: 0

      # Tên template do doanh nghiệp đặt.
      title: Vietnam Tax

      # Các dòng VAT/Tax áp dụng cho Item.
      taxes:
        # Child table Item Tax Template Detail.
        - # Account VAT/Tax được liên kết; phải thuộc Company tương ứng.
          tax_type: VAT - LTVN
          # Thuế suất áp dụng cho Item (%).
          tax_rate: 10.0
          # 1 = Tax không áp dụng cho Item; 0 = áp dụng tax_rate.
          # 🔹 ENUM: 0 | 1
          not_applicable: 0

  - doctype: Item Tax Template
    name: Vietnam Software Non-VAT - LTVN
    state: present

    # Item thuộc sản phẩm/dịch vụ phần mềm không chịu VAT theo phân loại pháp lý.
    fields:
      company: Letron Việt Nam
      disabled: 0
      title: Vietnam Software Non-VAT
      taxes:
        - tax_type: VAT - LTVN
          tax_rate: 0.0
          # Không chịu VAT; khác với giao dịch chịu VAT 0%.
          # 🔹 ENUM: 0 | 1
          not_applicable: 1

  - doctype: Purchase Taxes and Charges Template
    name: Vietnam Tax - LTVN
    state: present

    # [D.13] VAT/Tax cho giao dịch mua.
    fields:
      # Company sở hữu Purchase Tax Template.
      company: Letron Việt Nam
      # Vô hiệu hóa template.
      # 1 = không áp dụng; 0 = được dùng.
      # 🔹 ENUM: 0 | 1
      disabled: 0
      # Đánh dấu template mặc định cho Purchase transaction.
      # 1 = mặc định; 0 = không mặc định.
      # 🔹 ENUM: 0 | 1
      is_default: 0
      # Tax Category dùng để chọn template; null = không giới hạn Category.
      tax_category: null
      # Tên template do doanh nghiệp đặt.
      title: Vietnam Tax
      # Các dòng VAT/Tax áp dụng cho Purchase transaction.
      taxes:
        # Account ghi nhận VAT/Tax; phải thuộc Company tương ứng.
        - account_head: VAT - LTVN
          # Cộng hoặc trừ Tax khỏi giá trị transaction.
          # 🔹 ENUM: Add | Deduct
          add_deduct_tax: Add
          # Tax/Charge thuộc Valuation, Total hoặc cả hai.
          # 🔹 ENUM: Valuation and Total | Valuation | Total
          category: Total
          # Cách tính Tax trên giá trị giao dịch.
          # 🔹 ENUM: '' | Actual | On Net Total | On Previous Row Amount | On Previous Row Total | On Item Quantity
          charge_type: On Net Total
          # Cost Center ghi nhận VAT/Tax.
          cost_center: Main - LTVN
          # Mô tả hiển thị của dòng Tax/Charge.
          description: VAT @ 10.0
          # Tax Rate (%).
          rate: 10.0
          # Tax đã nằm trong giá cơ bản/in trên chứng từ chưa.
          # 1 = đã bao gồm; 0 = cộng thêm.
          # 🔹 ENUM: 0 | 1
          included_in_print_rate: 0
          # Project nhận diện chi phí/doanh thu của dòng; null = không gắn Project.
          project: null

  - doctype: Sales Taxes and Charges Template
    name: Vietnam Tax - LTVN
    state: present

    # [D.14] VAT/Tax cho giao dịch bán.
    fields:
      # Company sở hữu Sales Tax Template.
      company: Letron Việt Nam
      # Vô hiệu hóa template.
      # 1 = không áp dụng; 0 = được dùng.
      # 🔹 ENUM: 0 | 1
      disabled: 0
      # Đánh dấu template mặc định cho Sales transaction.
      # 1 = mặc định; 0 = không mặc định.
      # 🔹 ENUM: 0 | 1
      is_default: 0
      # Tax Category dùng để chọn template; null = không giới hạn Category.
      tax_category: null
      # Tên template do doanh nghiệp đặt.
      title: Vietnam Tax
      # Các dòng VAT/Tax áp dụng cho Sales transaction.
      taxes:
        # Account ghi nhận VAT/Tax; phải thuộc Company tương ứng.
        - account_head: VAT - LTVN
          # Cách tính Tax trên giá trị giao dịch.
          # 🔹 ENUM: '' | Actual | On Net Total | On Previous Row Amount | On Previous Row Total | On Item Quantity
          charge_type: On Net Total
          # Cost Center ghi nhận VAT/Tax.
          cost_center: Main - LTVN
          # Mô tả hiển thị của dòng Tax/Charge.
          description: VAT @ 10.0
          # Tax Rate (%).
          rate: 10.0
          # Tax đã nằm trong giá cơ bản/in trên chứng từ chưa.
          # 1 = đã bao gồm; 0 = cộng thêm.
          # 🔹 ENUM: 0 | 1
          included_in_print_rate: 0
          # Project nhận diện chi phí/doanh thu của dòng; null = không gắn Project.
          project: null

  - doctype: Sales Taxes and Charges Template
    name: Vietnam Software Non-VAT - LTVN
    state: present

    # Template không có dòng Tax/Charge cho doanh thu phần mềm không chịu VAT.
    fields:
      company: Letron Việt Nam
      disabled: 0
      is_default: 0
      tax_category: Domestic Software - Non-VAT - LTVN
      title: Vietnam Software Non-VAT
      taxes: []

  - doctype: Purchase Taxes and Charges Template
    name: Vietnam Software Non-VAT - LTVN
    state: present

    # Template không có dòng Tax/Charge cho dịch vụ phần mềm mua vào không chịu VAT.
    fields:
      company: Letron Việt Nam
      disabled: 0
      is_default: 0
      tax_category: Domestic Software - Non-VAT - LTVN
      title: Vietnam Software Non-VAT
      taxes: []

  - doctype: Tax Category
    name: Domestic Software - Non-VAT - LTVN
    state: present

    # Phân loại nội bộ cho sản phẩm/dịch vụ phần mềm không chịu VAT.
    fields:
