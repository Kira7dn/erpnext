version: 3
erpnext_version: 16.31.1

runtime:
  environment: production-like
  image: frappe/erpnext:v16.31.1
  platform: linux/amd64
  restart_policy: unless-stopped

project:
  name: erpnext
  http_port: 8080

integration:
  app_name: letron_api
  app_path: apps/letron_api
  install_on_site: true

database:
  image: mariadb:11.8
  host: db
  port: 3306
  root_user: root
  root_password: ${DB_ROOT_PASSWORD}
  charset: utf8mb4
  collation: utf8mb4_unicode_ci
  volume: db-data

redis:
  cache: redis:6379
  queue: redis:6379
  socketio: redis:6379
  cache_image: redis:6.2-alpine
  queue_image: redis:6.2-alpine

site:
  name: frontend
  header: frontend
  database_type: mariadb
  admin_password: ${ADMIN_PASSWORD}

developer:
  mode: false
  allow_tests: false
  request_timeout: 120

frontend:
  backend: backend:8000
  websocket: 127.0.0.1:9000
  upload_size: 50m
  proxy_timeout: 120

workers:
  short_command: "bench worker --queue short"
  short_replicas: 1
  long_command: "bench worker --queue long,default"
  scheduler_command: "bench schedule"

email:
  enabled: false
  host: smtp.example.local
  port: 587
  username: change-me
  password: ${SMTP_PASSWORD}
  use_tls: true

storage:
  sites_volume: sites
  logs_volume: logs
  redis_queue_volume: redis-queue-data
  backup_volume: backups

backup:
  enabled: true
  interval_hours: 24
  retention_days: 14
  with_files: true

credentials:
  production_like: true

delivery:
  enabled: false
  webhook_url: https://integration.example.invalid/webhook
  webhook_secret: ${LETRON_WEBHOOK_SECRET}
  webhook_timeout_ms: 5000
  realtime_url: https://integration.example.invalid/realtime
  realtime_token: ${LETRON_REALTIME_TOKEN}

# These are native Frappe System Settings harvested from the current tenant.
# letron_api only validates and reconciles their native field values.
system_settings:
  language: vi
  time_zone: Asia/Ho_Chi_Minh
  date_format: yyyy-mm-dd
  number_format: "#,###.##"
  enable_scheduler: 1
  enable_password_policy: 1
  session_expiry: "170:00"
