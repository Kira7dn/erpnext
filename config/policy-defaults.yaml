    finance_book: Consolidation Adjustment
    reporting_currency: VND
    require_closed_period: true
    intercompany_marker: LETRON-IC|id={matching_id}|source={source_company}|counterparty={counterparty_company}|type={transaction_type}
    elimination_rules:
    - code: IC_AR_AP
      label: Eliminate intercompany receivable and payable
      source_account_codes: ['131', '136', '138']
      counterparty_account_codes: ['331', '336', '338']
      debit_account_code: '331'
      credit_account_code: '131'
      # Post to the actual leaf Accounts found in the marked GL rows. The
      # fixed debit/credit codes above remain the policy fallback, while this
      # mode prevents posting to a parent Account such as 336 or 338.
      posting_mode: mirror_actual_accounts
    - code: IC_REVENUE_COST
      label: Eliminate intercompany revenue and cost
      source_account_codes: ['511', '515', '711']
      counterparty_account_codes: ['632', '635', '641', '642', '811']
      debit_account_code: '511'
      credit_account_code: '632'
      # Preserve the real revenue/expense Account pair (for example 515/635)
      # instead of forcing every elimination through 511/632.
      posting_mode: mirror_actual_accounts
