  - doctype: Purchase Taxes and Charges Template
    name: Vietnam Tax - LTVN
    state: present

    # [D.13] Purchase Taxes and Charges Template
    # 🧾 Tax/Charge cho giao dịch mua.
    # Mẫu thuế/phí mặc định cho giao dịch mua.
    fields:
      # Company sở hữu Purchase Tax Template; phải trùng Company của transaction.
      company: Letron Việt Nam

      # Vô hiệu hóa Purchase Tax Template.
      # 1 = không cho áp dụng; 0 = template được dùng.
      # 🔹 ENUM: 0 | 1
      disabled: 0

      # Đánh dấu template này là Purchase Tax Template mặc định.
      # 1 = mặc định; 0 = không mặc định.
      # 🔹 ENUM: 0 | 1
      is_default: 0

      # Tax Category dùng để chọn template theo nhóm thuế; null = không giới hạn Category.
      tax_category: null

      # Các dòng Tax/Charge áp dụng cho Purchase transaction.
      taxes:
        # Child table Purchase Taxes and Charges: các dòng Tax/Charge của giao dịch mua.
        # Currency của Account Head; null = dùng Currency của Company/transaction.
        - account_currency: null
          # Currency của Account Head dùng để ghi nhận Tax/Charge; null = dùng Currency của Account.
          account_head: VAT - LTVN
          # Cộng hoặc trừ Tax/Charge khỏi giá trị transaction.
          # 🔹 ENUM: Add | Deduct
          add_deduct_tax: Add
          # Phân bổ toàn bộ Tax/Charge vào Stock/Asset Value.
          # 1 = phân bổ toàn bộ; 0 = xử lý theo Category/logic thông thường.
          # 🔹 ENUM: 0 | 1
          allocate_full_amount_to_stock_items: 1
          # Net Amount của transaction theo Currency giao dịch; ERPNext tự tính.
          # Không nhập thủ công khi dùng policy để tạo template.
          base_net_amount: 0.0
          # Tax Amount theo Company Currency; ERPNext tự tính từ tax rule và exchange rate.
          # Không nhập thủ công.
          base_tax_amount: 0.0
          # Tax Amount sau Discount theo Company Currency; ERPNext tự tính.
          # Không nhập thủ công.
          base_tax_amount_after_discount_amount: 0.0
          # Total của dòng theo Company Currency; ERPNext tự tính.
          # Không nhập thủ công.
          base_total: 0.0
          # 🔹 ENUM: Valuation and Total | Valuation | Total
          category: Total
          # Phạm vi hạch toán của dòng Tax/Charge: Valuation, Total hoặc cả hai.
          # 🔹 ENUM: '' | Actual | On Net Total | On Previous Row Amount | On Previous Row Total | On Item Quantity
          charge_type: On Net Total
          # Cost Center ghi nhận chi phí/Tax; phải thuộc Company tương ứng.
          cost_center: Main - LTVN
          # Mô tả hiển thị của dòng Tax/Charge.
          description: VAT @ 10.0
          # Giữ Tax Amount hiện tại, không tính lại theo các Item trong transaction.
          # 1 = giữ nguyên; 0 = ERPNext tính lại. Chỉ dùng 1 khi cần override có chủ đích.
          # 🔹 ENUM: 0 | 1
          dont_recompute_tax: 0
          # Đưa Tax/Charge này vào số tiền được xem là đã thanh toán.
          # 1 = đã bao gồm trong Paid Amount; 0 = không bao gồm.
          # 🔹 ENUM: 0 | 1
          included_in_paid_amount: 0
          # Xem Tax/Charge đã nằm trong giá niêm yết/in trên chứng từ chưa.
          # 1 = đã bao gồm trong Print Rate; 0 = cộng thêm.
          # 🔹 ENUM: 0 | 1
          included_in_print_rate: 0
          # Đánh dấu Account Head là tài khoản Tax Withholding.
          # ERPNext tự xác định từ Account Head; field này read-only và không nên nhập thủ công.
          # 🔹 ENUM: 0 | 1
          is_tax_withholding_account: 0
          # Net Amount của transaction theo Currency giao dịch; ERPNext tự tính.
          # Không nhập thủ công.
          net_amount: 0.0
          # Project nhận diện chi phí/doanh thu của dòng; null = không gắn Project.
          project: null
          # Tax Rate (%) của dòng.
          rate: 10.0
          # Số thứ tự dòng Tax được tham chiếu khi charge_type dùng Previous Row.
          # null = không tham chiếu dòng trước.
          row_id: null
          # Cờ nội bộ cho biết dòng được tạo từ Item Tax Template.
          # ERPNext tự đặt; không nên nhập thủ công trong policy.
          # 🔹 ENUM: 0 | 1
          set_by_item_tax_template: 0
          # Tax Amount theo Currency giao dịch; ERPNext tự tính.
          # Không nhập thủ công.
          tax_amount: 0.0
          # Tax Amount sau Discount theo Currency giao dịch; ERPNext tự tính.
          # Không nhập thủ công.
          tax_amount_after_discount_amount: 0.0
          # Total của dòng theo Currency giao dịch; ERPNext tự tính.
          # Không nhập thủ công.
          total: 0.0
      # Tên hiển thị của Purchase Tax Template; do doanh nghiệp đặt, không phải ENUM.
      title: Vietnam Tax
