# UTF-8 local configuration template. Copy to config.yml; config.yml is ignored.
runtime:
  environment: local
  image: frappe/erpnext:v16.31.1
  platform: linux/amd64
  restart_policy: unless-stopped
project:
  name: erpnext
  http_port: 8080
integration:
  app_name: letron_api
  app_path: apps/letron_api
  install_on_site: true
  api_enabled: true
database:
  image: mariadb:11.8
  host: db
  port: 3306
  root_user: root
  root_password: change-me-local-db
  charset: utf8mb4
  collation: utf8mb4_unicode_ci
  volume: db-data
redis:
  cache: redis-cache:6379
  queue: redis-queue:6379
  socketio: redis-queue:6379
  cache_image: redis:6.2-alpine
  queue_image: redis:6.2-alpine
site:
  name: frontend
  header: frontend
  database_type: mariadb
  admin_password: change-me-local-admin
locale:
  country: Vietnam
  timezone: Asia/Ho_Chi_Minh
  language: vi
  currency: VND
developer:
  mode: true
  allow_tests: true
  request_timeout: 120
frontend:
  backend: backend:8000
  websocket: websocket:9000
  upload_size: 50m
  proxy_timeout: 120
workers:
  short_command: "bench worker --queue short,default"
  long_command: "bench worker --queue long,default,short"
  scheduler_command: "bench schedule"
email:
  enabled: false
  host: smtp.example.local
  port: 587
  username: change-me
  password: change-me
  use_tls: true
storage:
  sites_volume: sites
  logs_volume: logs
  redis_queue_volume: redis-queue-data
  backup_enabled: false
  backup_volume: backups
seed:
  enabled: false
  company_name: Letron Việt Nam
  company_abbr: LTVN
  domain: Distribution
  warehouse_name: Main Warehouse
credentials:
  production_like: false
